name: wago-facet CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.23.x"
      - name: Check module files
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Download modules
        run: go mod download
      - name: Check formatting
        shell: bash
        run: |
          files=$(gofmt -l .)
          test -z "$files" || { printf 'gofmt required:\n%s\n' "$files"; exit 1; }
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.23.x"
      - id: facet-spec
        name: Read pinned Facet spec revision
        shell: bash
        run: echo "revision=$(cat tests/conformance/FACET_SPEC_REVISION)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: jtenner/facet-spec
          ref: ${{ steps.facet-spec.outputs.revision }}
          path: .facet-spec
      - name: Install pinned wasm-tools
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://github.com/bytecodealliance/wasm-tools/releases/download/v1.256.0/wasm-tools-1.256.0-x86_64-linux.tar.gz \
            --output /tmp/wasm-tools.tar.gz
          echo "0b488be25c9e8a74dfa09f7eac614a927ea197f389d8fa5a21ffb1c15deb469d  /tmp/wasm-tools.tar.gz" | sha256sum --check
          tar -xzf /tmp/wasm-tools.tar.gz -C /tmp
          sudo install /tmp/wasm-tools-1.256.0-x86_64-linux/wasm-tools /usr/local/bin/wasm-tools
      - name: Run Facet 0.1 WAST conformance
        env:
          FACET_SPEC_DIR: ${{ github.workspace }}/.facet-spec
        run: go test -count=1 -run '^(TestFacetConformance|TestFacetHarness)$' -v .
